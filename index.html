<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronomètre</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
  }
  #time { font-size: 4rem; font-variant-numeric: tabular-nums; }
  button {
    font-size: 1.1rem;
    padding: 10px 22px;
    margin: 0 6px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  #toggle { background: #2e7d32; color: #fff; }
  #reset { background: #444; color: #fff; }
  #message {
    min-height: 2.5rem;
    font-size: 2rem;
    font-weight: bold;
    color: #ff5252;
    opacity: 0;
    transition: opacity .3s;
  }
  #message.show { opacity: 1; }
</style>
</head>
<body>
  <div id="time">00:00.0</div>
  <div>
    <button id="toggle">Démarrer</button>
    <button id="reset">Réinitialiser</button>
  </div>
  <div id="message"></div>

<script>
  const INTERVAL_MS = 2 * 60 * 1000;
  const MESSAGE = "Fuck you Louka";

  const timeEl = document.getElementById("time");
  const msgEl = document.getElementById("message");
  const toggleBtn = document.getElementById("toggle");
  const resetBtn = document.getElementById("reset");

  let elapsed = 0;       // ms accumulés avant le dernier démarrage
  let startedAt = null;  // timestamp du dernier démarrage
  let timer = null;
  let lastTriggered = 0; // nombre de paliers de 2 min déjà annoncés
  let hideTimeout = null;

  const pad = (n) => String(n).padStart(2, "0");

  function now() {
    return elapsed + (startedAt ? Date.now() - startedAt : 0);
  }

  function render() {
    const t = now();
    const totalSec = Math.floor(t / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const tenth = Math.floor((t % 1000) / 100);
    timeEl.textContent = (h ? pad(h) + ":" : "") + pad(m) + ":" + pad(s) + "." + tenth;

    const steps = Math.floor(t / INTERVAL_MS);
    if (steps > lastTriggered) {
      lastTriggered = steps;
      announce();
    }
  }

  function announce() {
    msgEl.textContent = MESSAGE;
    msgEl.classList.add("show");
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => msgEl.classList.remove("show"), 5000);
    if ("speechSynthesis" in window) {
      const u = new SpeechSynthesisUtterance(MESSAGE);
      u.lang = "fr-FR";
      speechSynthesis.speak(u);
    }
  }

  toggleBtn.onclick = () => {
    if (startedAt) {
      elapsed += Date.now() - startedAt;
      startedAt = null;
      clearInterval(timer);
      toggleBtn.textContent = "Reprendre";
      toggleBtn.style.background = "#2e7d32";
    } else {
      startedAt = Date.now();
      timer = setInterval(render, 100);
      toggleBtn.textContent = "Pause";
      toggleBtn.style.background = "#c62828";
    }
  };

  resetBtn.onclick = () => {
    clearInterval(timer);
    elapsed = 0;
    startedAt = null;
    lastTriggered = 0;
    clearTimeout(hideTimeout);
    msgEl.classList.remove("show");
    toggleBtn.textContent = "Démarrer";
    toggleBtn.style.background = "#2e7d32";
    render();
  };
</script>
</body>
</html>
